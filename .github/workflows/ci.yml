name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_LOCKED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libcairo2 libffi8
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Set up project
        run: make setup
      - name: Run checks
        run: make check
