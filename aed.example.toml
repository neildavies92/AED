# Copy to aed.toml; relative paths are based on that file's directory.
database_path = "data/aed.sqlite3"
assets_path = "assets/generated"
account_handle = "@ask.every.day"

# This table is optional; these are the defaults.
[renderer]
template = "Classic"
width = 1080
height = 1350

# Rotates by successfully published themed images, independently of Post IDs.
[palette]
backgrounds = ["#E2EFF9", "#EDF4FB", "#D3E6F5"]
text_color = "#1C3651"
accent_color = "#2F608C"
seed = 42
