[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ask-every-day"
version = "0.1.0"
description = "Local-first automation for Ask Every Day."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cairosvg>=2.8.2,<3",
    "jinja2>=3.1.6,<4",
    "pillow>=12.3,<13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "pyright>=1.1.400",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ask_every_day"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests", "deployment/desktop_scheduler.py"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
executionEnvironments = [{ root = ".", extraPaths = ["src"] }]
